[project]
name = "newtons-cradle"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dpeaDPi==3.1.0",
    "kivy==2.3.1",
    "pydantic==2.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis==6.168.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
